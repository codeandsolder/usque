name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download and verify Wintun
        env:
          WINTUN_VERSION: "0.14.1"
          WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/wintun-${WINTUN_VERSION}.zip"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --output "${archive}" \
            "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip"
          printf '%s  %s\n' "${WINTUN_SHA256}" "${archive}" | sha256sum --check --strict -
          unzip -q "${archive}" -d "${GITHUB_WORKSPACE}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
